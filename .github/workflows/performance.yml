name: performance

# How much DeckHost takes from a computer (docs/performance.md): benchmarks/DeckHost.Benchmark starts
# the published app with a simulated N4 Pro and measures start-up, idle (window open and in the tray),
# a busy minute and press-to-image latency on Windows, Linux and macOS.
#  - Pull requests: a check per system that fails when a number is over benchmarks/budgets.json, and
#    one comment comparing every number with the last release.
#  - Tags (releases): the results go to the perf-data branch and the docs site is rebuilt with them.
on:
  pull_request:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  OPENCV_VERSION: 4.10.0

permissions:
  contents: read

concurrency:
  group: performance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  measure:
    name: measure (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            system: windows
          - os: ubuntu-22.04
            rid: linux-x64
            system: linux
          - os: macos-latest
            rid: osx-arm64
            system: macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Version
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          scripts/version.sh "$BRANCH" > "$RUNNER_TEMP/version.txt"
          . "$RUNNER_TEMP/version.txt"
          echo "VERSION_ARGS=-p:DisableGitVersionTask=true -p:Version=$version" >> "$GITHUB_ENV"

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libudev-dev libgif-dev libusb-1.0-0-dev xvfb

      - name: Cache static OpenCV
        if: runner.os == 'Linux'
        id: opencv
        uses: actions/cache@v4
        with:
          path: ~/opencv-static
          key: opencv-${{ env.OPENCV_VERSION }}-static-${{ matrix.os }}-${{ hashFiles('scripts/build-opencv-static.sh') }}

      - name: Build static OpenCV
        if: runner.os == 'Linux' && steps.opencv.outputs.cache-hit != 'true'
        run: scripts/build-opencv-static.sh "$HOME/opencv-static"

      # The same build users get (release.yml's publish).
      - name: Publish
        run: |
          args=()
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            args+=("-p:MiraBoxCMakeArgs=-DOpenCV_DIR=$HOME/opencv-static/lib/cmake/opencv4")
          fi
          dotnet publish DeckHost.App/DeckHost.App.csproj -c Release -r ${{ matrix.rid }} --self-contained \
            -o publish/DeckHost $VERSION_ARGS "${args[@]}"
          dotnet build benchmarks/DeckHost.Benchmark/DeckHost.Benchmark.csproj -c Release -o benchmark $VERSION_ARGS -p:EnableMiraBoxNativeBuild=false

      # The last release's numbers, to compare with (none before the first measured release).
      - name: Last release
        run: |
          if git ls-remote --exit-code --heads origin perf-data >/dev/null; then
            git fetch --depth 1 origin perf-data
            git worktree add perf-data FETCH_HEAD
            latest="$(python3 -c "import json;r=json.load(open('perf-data/index.json'))['releases'];print(r[0]['systems'].get('${{ matrix.system }}','') if r else '')")"
            if [[ -n "$latest" ]]; then echo "PREVIOUS=perf-data/$latest" >> "$GITHUB_ENV"; fi
          fi

      - name: Measure
        id: measure
        run: |
          program=publish/DeckHost/DeckHost.App
          if [[ "$RUNNER_OS" == "Windows" ]]; then program=publish/DeckHost/DeckHost.App.exe; fi
          args=(--app "$program" --out "result-${{ matrix.system }}.json" --budgets benchmarks/budgets.json --replace-data)
          if [[ -n "${PREVIOUS:-}" ]]; then args+=(--previous "$PREVIOUS"); fi
          run=(dotnet benchmark/DeckHost.Benchmark.dll "${args[@]}")
          if [[ "$RUNNER_OS" == "Linux" ]]; then run=(xvfb-run -a -s "-screen 0 1920x1080x24" "${run[@]}"); fi
          set +e
          "${run[@]}"
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          # 1 = over a budget (the result is still uploaded and reported); anything else is a broken run.
          if [[ "$code" -ne 0 && "$code" -ne 1 ]]; then exit "$code"; fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-${{ matrix.system }}
          path: result-${{ matrix.system }}.json
          if-no-files-found: ignore

      - name: Budget
        if: steps.measure.outputs.code == '1'
        run: |
          echo "::error::DeckHost is over its performance budget on ${{ matrix.system }}; see the job summary."
          exit 1

  # One comment on the pull request with every system next to the last release and the budgets.
  report:
    needs: measure
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: performance-*
          merge-multiple: true
          path: results
      - name: Compare
        run: |
          previous=()
          if git ls-remote --exit-code --heads origin perf-data >/dev/null; then
            git fetch --depth 1 origin perf-data
            git worktree add perf-data FETCH_HEAD
            previous=(--previous-dir perf-data)
          fi
          shopt -s nullglob
          python3 scripts/performance-page.py compare benchmarks/budgets.json results/*.json "${previous[@]}" > comment.md
          cat comment.md >> "$GITHUB_STEP_SUMMARY"
      # Pull requests from forks can't comment with this token; their numbers stay in the summary.
      - name: Comment
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          existing="$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq '[.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- deckhost:performance -->")))][0].id // empty')"
          if [[ -n "$existing" ]]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" -F body=@comment.md >/dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F body=@comment.md >/dev/null
          fi

  # A release: keep its numbers on the perf-data branch and rebuild the docs site with them.
  publish:
    needs: measure
    if: always() && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: performance-*
          merge-multiple: true
          path: results
      - name: perf-data
        env:
          TAG: ${{ github.ref_name }}
        run: |
          shopt -s nullglob
          files=(results/*.json)
          if [[ ${#files[@]} -eq 0 ]]; then echo "No results to publish."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin perf-data >/dev/null; then
            git fetch --depth 1 origin perf-data
            git worktree add -B perf-data data FETCH_HEAD
          else
            git worktree add --orphan -b perf-data data
          fi
          python3 scripts/performance-page.py index data "$TAG" "${files[@]}"
          cd data
          git add -A
          git commit -m "Performance of $TAG" -m "By the performance workflow (benchmarks/DeckHost.Benchmark)."
          git push origin perf-data
      - name: Rebuild the docs
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run docs.yml --repo "$GITHUB_REPOSITORY" --ref "${{ github.event.repository.default_branch }}"
