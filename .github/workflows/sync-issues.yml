name: sync issues

# Links the issues of the public releases repository (where DeckHost's "Report a problem" opens
# them) to this repository: new reports get a copy here, comments follow, `/public <text>` comments
# here are posted there, and closing a copy as completed closes the report. See scripts/sync-issues.py
# and docs/maintainers/releasing.md. Needs the RELEASES_REPO variable and a RELEASES_TOKEN that may
# also read and write issues there.
on:
  schedule:
    - cron: "23 * * * *"
  issue_comment:
    types: [created]
  issues:
    types: [closed]
  workflow_dispatch:
    inputs:
      lookback_days:
        description: How many days back to look
        default: "14"
      dry_run:
        description: Only print what it would do
        type: boolean
        default: false

permissions:
  issues: write

concurrency:
  group: sync-issues
  cancel-in-progress: false

jobs:
  sync:
    # Comments and closes only matter on the copies.
    if: >-
      vars.RELEASES_REPO != '' && vars.RELEASES_REPO != github.repository &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
       contains(github.event.issue.labels.*.name, 'public-report'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: scripts/sync-issues.py
          sparse-checkout-cone-mode: false

      - name: Sync
        env:
          PUBLIC_REPO: ${{ vars.RELEASES_REPO }}
          PRIVATE_REPO: ${{ github.repository }}
          PUBLIC_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          PRIVATE_TOKEN: ${{ github.token }}
          LOOKBACK_DAYS: ${{ inputs.lookback_days || '14' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: python3 -I scripts/sync-issues.py
