name: release

# Push a tag like v1.2.0 (or v1.2.0-rc.1 for a pre-release) to build, package and publish a
# GitHub release; the tag is the version. Started by hand, or on a pull request that changes the
# packaging, it only builds the packages, as workflow artifacts, versioned by GitVersion from the
# branch (scripts/version.sh, GitVersion.yml).
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "packaging/**"
      - "scripts/package.sh"
      - "scripts/build-opencv-static.sh"
      - "Directory.Build.props"
      - "GitVersion.yml"
      - "scripts/version.sh"
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  OPENCV_VERSION: 4.10.0

permissions:
  contents: read

jobs:
  package:
    name: package (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-22.04
            rid: linux-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    # Code signing is optional: without these secrets the packages are built unsigned (Windows
    # SmartScreen warns, macOS asks to allow the app once). See docs/maintainers/releasing.md.
    env:
      HAS_MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE != '' }}
      HAS_AZURE_SIGNING: ${{ vars.AZURE_SIGNING_ACCOUNT != '' && secrets.AZURE_CLIENT_SECRET != '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0
          # On a pull request: the branch's commit, not GitHub's temporary merge commit, so the
          # commit in a pre-release's version can be looked up.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Version
        id: version
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          scripts/version.sh "$BRANCH" > "$RUNNER_TEMP/version.txt"
          cat "$RUNNER_TEMP/version.txt" | tee -a "$GITHUB_OUTPUT"
          # Later builds stamp this version instead of running GitVersion again.
          . "$RUNNER_TEMP/version.txt"
          echo "VERSION_ARGS=-p:DisableGitVersionTask=true -p:Version=$version" >> "$GITHUB_ENV"

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libudev-dev libgif-dev libusb-1.0-0-dev imagemagick

      - name: Cache static OpenCV
        if: runner.os == 'Linux'
        id: opencv
        uses: actions/cache@v4
        with:
          path: ~/opencv-static
          key: opencv-${{ env.OPENCV_VERSION }}-static-${{ matrix.os }}-${{ hashFiles('scripts/build-opencv-static.sh') }}

      - name: Build static OpenCV
        if: runner.os == 'Linux' && steps.opencv.outputs.cache-hit != 'true'
        run: scripts/build-opencv-static.sh "$HOME/opencv-static"

      - name: Test
        run: |
          args=()
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            args+=("-p:MiraBoxCMakeArgs=-DOpenCV_DIR=$HOME/opencv-static/lib/cmake/opencv4")
          fi
          dotnet test DeckHost.Tests/DeckHost.Tests.csproj -c Release $VERSION_ARGS "${args[@]}"

      - name: Publish
        run: |
          args=()
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            args+=("-p:MiraBoxCMakeArgs=-DOpenCV_DIR=$HOME/opencv-static/lib/cmake/opencv4")
          fi
          # The updater looks for releases where they are published (see the release job).
          dotnet publish DeckHost.App/DeckHost.App.csproj -c Release -r ${{ matrix.rid }} --self-contained \
            -o publish/DeckHost $VERSION_ARGS "-p:DeckHostUpdateRepository=${{ github.repository }}" "${args[@]}"

      # The published app must load its native bridge on a clean machine.
      - name: Check the native bridge
        timeout-minutes: 2
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            publish/DeckHost/DeckHost.App.exe --check-native
          else
            publish/DeckHost/DeckHost.App --check-native
          fi

      - name: Signing certificate (macOS)
        if: runner.os == 'macOS' && env.HAS_MACOS_CERTIFICATE == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -hex 16)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$keychain" | grep 'Developer ID Application' | head -1 | sed -E 's/.*"(.*)"/\1/')"
          if [[ -z "$identity" ]]; then echo "No Developer ID Application identity in the certificate." >&2; exit 1; fi
          echo "MACOS_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Package (Linux, macOS)
        if: runner.os != 'Windows'
        env:
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: scripts/package.sh ${{ matrix.rid }} "${{ steps.version.outputs.file }}" publish/DeckHost artifacts/release "${{ steps.version.outputs.display }}"

      # Windows signing, either way (no-op without the secrets):
      #  - a certificate file: the WINDOWS_CERTIFICATE secret (.pfx), signed by scripts/sign-windows.ps1;
      #  - Azure Artifact Signing: the AZURE_SIGNING_ENDPOINT, AZURE_SIGNING_ACCOUNT and
      #    AZURE_SIGNING_PROFILE variables plus the AZURE_TENANT_ID, AZURE_CLIENT_ID and
      #    AZURE_CLIENT_SECRET secrets (scripts/setup-azure-signing.sh creates them).
      - name: Files to sign (Windows)
        if: runner.os == 'Windows'
        id: windows-files
        shell: pwsh
        run: |
          # DeckHost's own programs and libraries.
          $own = @(Get-Item publish/DeckHost/DeckHost.App.exe) + @(Get-ChildItem publish/DeckHost -Recurse -Include 'DeckHost.*.dll', 'MiraBoxBridge.dll')
          $list = ($own | ForEach-Object FullName) -join ','
          "list=$list" >> $env:GITHUB_OUTPUT

      - name: Sign with the certificate file (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: ./scripts/sign-windows.ps1 @("${{ steps.windows-files.outputs.list }}".Split(','))

      - name: Sign with Azure Artifact Signing (Windows)
        if: runner.os == 'Windows' && env.HAS_AZURE_SIGNING == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          files: ${{ steps.windows-files.outputs.list }}
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: DeckHost
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: true
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true

      - name: Package (Windows)
        if: runner.os == 'Windows'
        id: windows-package
        shell: pwsh
        run: |
          $file = "${{ steps.version.outputs.file }}"
          New-Item -ItemType Directory -Force artifacts/release | Out-Null
          Compress-Archive -Path publish/DeckHost -DestinationPath "artifacts/release/DeckHost-$file-win-x64.zip"
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup -y --no-progress | Out-Null
            $env:Path += ";${env:ProgramFiles(x86)}\Inno Setup 6"
          }
          iscc /Qp "/DAppVersion=${{ steps.version.outputs.display }}" "/DFileVersion=$file" "/DNumericVersion=${{ steps.version.outputs.numeric }}" `
            "/DSourceDir=$PWD\publish\DeckHost" "/DOutputDir=$PWD\artifacts\release" packaging/windows/DeckHost.iss
          $setup = (Get-ChildItem artifacts/release -Filter '*.exe' | ForEach-Object FullName) -join ','
          "setup=$setup" >> $env:GITHUB_OUTPUT

      - name: Sign the setup with the certificate file (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: ./scripts/sign-windows.ps1 @("${{ steps.windows-package.outputs.setup }}".Split(','))

      - name: Sign the setup with Azure Artifact Signing (Windows)
        if: runner.os == 'Windows' && env.HAS_AZURE_SIGNING == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          files: ${{ steps.windows-package.outputs.setup }}
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: DeckHost Setup
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: true
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true

      # The OBS plugin (built by the tests) goes out with each release, for the plugin catalog
      # (packaging/plugins-repo): its download_url and sha256 point at this file.
      - name: Plugin packages
        if: runner.os == 'Linux'
        run: cp artifacts/plugins/deckhost.plugin.obs.zip artifacts/release/

      # The plugin API as a NuGet package (DeckHost.Contracts), for plugins built outside this
      # repository and the dotnet new template; attached to the release, pushed to NuGet below.
      - name: NuGet packages
        if: runner.os == 'Linux'
        run: |
          dotnet pack DeckHost.Contracts/DeckHost.Contracts.csproj -c Release $VERSION_ARGS -o artifacts/release
          dotnet pack templates/DeckHost.Templates.csproj -c Release $VERSION_ARGS -o artifacts/release

      - uses: actions/upload-artifact@v4
        with:
          name: DeckHost-${{ steps.version.outputs.file }}-${{ matrix.rid }}
          path: artifacts/release/*
          if-no-files-found: error

  release:
    needs: package
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Build provenance (public source repositories; a private one needs GitHub Enterprise Cloud).
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        working-directory: artifacts
        run: sha256sum * > SHA256SUMS.txt

      # A signed statement that these files were built by this workflow from this commit
      # (Sigstore; check with `gh attestation verify <file> --repo <owner/repo>`). Free and automatic.
      - name: Build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: artifacts/*

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=()
          if [[ "$TAG" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          # The notes: the pull requests merged since the previous release.
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$TAG" --jq .body > notes.md
          gh release create "$TAG" artifacts/* --repo "$GITHUB_REPOSITORY" --title "DeckHost ${TAG#v}" --notes-file notes.md "${prerelease[@]}"

      # With a NUGET_API_KEY secret (nuget.org → API keys, push for DeckHost.*), the NuGet packages
      # go to nuget.org too. Without it they're only attached to the release.
      - name: Publish to NuGet
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [[ -z "$NUGET_API_KEY" ]]; then
            echo "No NUGET_API_KEY secret: the NuGet packages are only attached to the release."
            exit 0
          fi
          for package in artifacts/*.nupkg; do
            dotnet nuget push "$package" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
          done
