name: docs

# Builds the documentation (MkDocs, docs/ and mkdocs.yml). On develop and main it publishes it to
# this repository's GitHub Pages. The performance workflow also starts it after measuring a release.
on:
  push:
    branches: [develop, main]
    paths: ["docs/**", "mkdocs.yml", "CHANGELOG.md", ".github/workflows/docs.yml", "benchmarks/budgets.json", "benchmarks/performance-data.md", "scripts/performance-page.py"]
  pull_request:
    paths: ["docs/**", "mkdocs.yml", "CHANGELOG.md", ".github/workflows/docs.yml", "benchmarks/budgets.json", "benchmarks/performance-data.md", "scripts/performance-page.py"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install mkdocs-material==9.5.49
      # The performance page's numbers: every measured release on the perf-data branch (performance.yml).
      - name: Performance numbers
        run: |
          if git ls-remote --exit-code --heads origin perf-data >/dev/null; then
            git fetch --depth 1 origin perf-data
            git worktree add perf-data FETCH_HEAD
            python3 scripts/performance-page.py page perf-data benchmarks/budgets.json benchmarks/performance-data.md
          fi
      - run: mkdocs build --strict
      # The Pages artifact is made here and deployed by the next job, as in GitHub's Pages template.
      # Uploaded and deployed in the same job, deploy-pages's artifact list didn't show it yet
      # ("No artifacts named github-pages", actions/deploy-pages#305).
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: site

  publish-to-pages:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
