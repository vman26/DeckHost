name: docs

# Builds the documentation (MkDocs, docs/ and mkdocs.yml). On develop and main it publishes it:
# to the public releases repository's gh-pages branch when RELEASES_REPO and RELEASES_TOKEN are
# set (see docs/maintainers/releasing.md), else to this repository's GitHub Pages.
on:
  push:
    branches: [develop, main]
    paths: ["docs/**", "mkdocs.yml", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["docs/**", "mkdocs.yml", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install mkdocs-material==9.5.49
      - run: mkdocs build --strict
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site

  publish-to-releases-repo:
    needs: build
    if: github.event_name != 'pull_request' && vars.RELEASES_REPO != '' && vars.RELEASES_REPO != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site
      - name: Push to the releases repository's gh-pages branch
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          RELEASES_REPO: ${{ vars.RELEASES_REPO }}
        run: |
          if [[ -z "$RELEASES_TOKEN" ]]; then echo "RELEASES_TOKEN is not set." >&2; exit 1; fi
          cd site
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Documentation from ${GITHUB_REPOSITORY}@${GITHUB_SHA::7}"
          git push -q --force "https://x-access-token:${RELEASES_TOKEN}@github.com/${RELEASES_REPO}.git" gh-pages

  publish-to-pages:
    needs: build
    if: github.event_name != 'pull_request' && (vars.RELEASES_REPO == '' || vars.RELEASES_REPO == github.repository)
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
