name: build

on:
  push:
    branches: [main, develop]
  pull_request:
  # Run it by hand on any branch from the Actions tab.
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  OPENCV_VERSION: 4.10.0

jobs:
  # CHANGELOG.md keeps the format the release notes are made from (scripts/release-notes.py).
  changelog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - run: python3 scripts/release-notes.py check

  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Linux builds on the oldest supported Ubuntu, so the binaries also run on older glibc.
        # macOS: Apple Silicon only; the StreamDock SDK ships its transport library for arm64 only.
        os: [windows-latest, ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0 # GitVersion reads the version from the tags and branches

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Version
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          scripts/version.sh "$BRANCH" > "$RUNNER_TEMP/version.txt"
          cat "$RUNNER_TEMP/version.txt"
          # Later builds stamp this version instead of running GitVersion again.
          . "$RUNNER_TEMP/version.txt"
          echo "VERSION_ARGS=-p:DisableGitVersionTask=true -p:Version=$version" >> "$GITHUB_ENV"

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libudev-dev libgif-dev libusb-1.0-0-dev

      # A small static OpenCV, so the bridge doesn't depend on the distribution's OpenCV.
      - name: Cache static OpenCV
        if: runner.os == 'Linux'
        id: opencv
        uses: actions/cache@v4
        with:
          path: ~/opencv-static
          key: opencv-${{ env.OPENCV_VERSION }}-static-${{ matrix.os }}-${{ hashFiles('scripts/build-opencv-static.sh') }}

      - name: Build static OpenCV
        if: runner.os == 'Linux' && steps.opencv.outputs.cache-hit != 'true'
        run: scripts/build-opencv-static.sh "$HOME/opencv-static"

      - name: Build
        run: |
          args=()
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            args+=("-p:MiraBoxCMakeArgs=-DOpenCV_DIR=$HOME/opencv-static/lib/cmake/opencv4")
          fi
          dotnet build DeckHost.slnx -c Release $VERSION_ARGS "${args[@]}"

      - name: Test
        run: dotnet test DeckHost.Tests/DeckHost.Tests.csproj -c Release --no-build $VERSION_ARGS

      # Loads the native bridge from the app's plugin folder, as the app does, and lists devices.
      - name: Check the native bridge
        timeout-minutes: 2
        run: dotnet DeckHost.App/bin/Release/net10.0/DeckHost.App.dll --check-native

  # The plugin SDK as a plugin author gets it: the DeckHost.Contracts package and the dotnet new
  # template, packed here, then a new plugin made from the template is built and checked.
  plugin-template:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Pack the Contracts package and the template
        run: |
          dotnet pack DeckHost.Contracts/DeckHost.Contracts.csproj -c Release -o "$RUNNER_TEMP/feed"
          dotnet pack templates/DeckHost.Templates.csproj -c Release -o "$RUNNER_TEMP/feed"
      - name: Make and build a plugin from the template
        run: |
          dotnet new install "$RUNNER_TEMP"/feed/DeckHost.Templates.*.nupkg
          cd "$RUNNER_TEMP"
          dotnet new deckhost-plugin -n SamplePlugin --pluginId ci.plugin.sample --authorName CI
          cd SamplePlugin
          dotnet new nugetconfig
          dotnet nuget add source "$RUNNER_TEMP/feed" --name local --configfile nuget.config
          dotnet build -c Release -warnaserror
          unzip -l bin/plugin/ci.plugin.sample.zip
      - name: Check the plugin with DeckHost's checker
        run: |
          dotnet run --project DeckHost.App -c Release -p:EnableMiraBoxNativeBuild=false -- --check-plugin "$RUNNER_TEMP/SamplePlugin/bin/plugin/ci.plugin.sample.zip"
