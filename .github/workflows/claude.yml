name: claude

# Ask Claude (Claude Code) to look at an issue or a pull request: write "@claude" with what you want
# in an issue, a comment or a review, or put the "claude" label on an issue. Claude reads the
# repository (CLAUDE.md explains it), can build and run the tests, pushes its work to a branch and
# answers with what it did and a link to open a pull request. Nothing is merged without you.
#
# Only people with write access to this repository can start it (the action checks), so on this
# public repository strangers can't run it on your account.
#
# Setup, once: install the Claude GitHub App (https://github.com/apps/claude) on this repository,
# and add ONE secret: CLAUDE_CODE_OAUTH_TOKEN (Claude Pro/Max: run `claude setup-token` locally) or
# ANTHROPIC_API_KEY (console.anthropic.com). See docs/maintainers/claude.md.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned, labeled]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude') || github.event.label.name == 'claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: false

      # So Claude can build DeckHost and run its tests (without the native MiraBox bridge).
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          label_trigger: claude
          claude_args: |
            --max-turns 60
            --append-system-prompt "Build with: dotnet build DeckHost.slnx -p:EnableMiraBoxNativeBuild=false. Test with: dotnet test DeckHost.Tests -p:EnableMiraBoxNativeBuild=false. Follow CLAUDE.md. Fix the cause, add a test that would have caught it, run the whole test suite before pushing, and say in your answer what you changed and how you checked it. Make one commit per change."
