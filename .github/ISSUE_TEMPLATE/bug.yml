name: Problem
description: "Something doesn't work as it should. Tip: in DeckHost, ☰ → Help and support → Report a problem fills in the version and devices for you."
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. …"
  - type: input
    id: version
    attributes:
      label: DeckHost version
      description: ☰ → About, or the top of the Help and support page.
    validations:
      required: true
  - type: dropdown
    id: system
    attributes:
      label: System
      options: [Windows, macOS, Linux]
    validations:
      required: true
  - type: input
    id: devices
    attributes:
      label: Devices
      placeholder: N4 Pro, Stream Deck +, Web Deck…
  - type: markdown
    attributes:
      value: A support bundle (☰ → Help and support → Save support bundle) helps a lot; look inside before you attach it.
