name: Idea
description: Something DeckHost could do.
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like DeckHost to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: What for?
      description: What you're trying to get done helps more than how.
