site_name: DeckHost
site_description: One platform. Unlimited control. A free, open-source host for the MiraBox N4 Pro, Elgato Stream Decks, a Web Deck and USB devices.
repo_url: https://github.com/vman26/DeckHost
repo_name: vman26/DeckHost
copyright: DeckHost is free software under the GNU GPL v3.0 or later
docs_dir: docs
site_dir: site
strict: true
theme:
  name: material
  logo: deckhost-logo.png
  favicon: deckhost-logo.png
  palette:
    scheme: slate
    primary: indigo
    accent: indigo
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Devices: devices.md
  - Using DeckHost:
      - The editor: editor.md
      - Profiles, pages and folders: profiles.md
      - Multi Action and Key Logic: multi-actions.md
      - Workflows: workflows.md
      - Lights: lights.md
      - Plugins and the store: plugins.md
  - Reference:
      - Built-in actions: reference/actions.md
      - Plugin API: reference/api.md
  - Updates: updates.md
  - Troubleshooting: troubleshooting.md
  - Privacy: privacy.md
  - For maintainers:
      - Releasing and signing: maintainers/releasing.md
      - Writing plugins: maintainers/plugins.md
      - Device plugins: maintainers/device-plugins.md
      - The plugin catalog: maintainers/plugin-store.md
      - Going public: maintainers/going-public.md
      - Architecture: maintainers/architecture.md
      - Decisions:
          - maintainers/adr/index.md
          - "0001 Dependency rule": maintainers/adr/0001-dependency-rule.md
          - "0002 One worker": maintainers/adr/0002-single-worker.md
          - "0003 Plugin API": maintainers/adr/0003-plugin-api.md
          - "0004 Immutable bindings": maintainers/adr/0004-immutable-bindings.md
          - "0005 Profile migrations": maintainers/adr/0005-profile-migrations.md
          - "0006 Workflows": maintainers/adr/0006-workflows.md
          - "0007 Plugins in their own process": maintainers/adr/0007-in-process-plugins.md
          - "0008 Generic USB devices": maintainers/adr/0008-generic-usb-devices.md
          - "0009 Firmware updates": maintainers/adr/0009-firmware-updates.md
          - "0010 License": maintainers/adr/0010-license.md
