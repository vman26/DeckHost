site_name: DeckHost
site_description: One platform. Unlimited control. A host for the MiraBox N4 Pro, Elgato Stream Decks and a Web Deck.
docs_dir: docs
site_dir: site
strict: true
theme:
  name: material
  logo: deckhost-logo.png
  favicon: deckhost-logo.png
  palette:
    scheme: slate
    primary: indigo
    accent: indigo
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Devices: devices.md
  - Using DeckHost:
      - The editor: editor.md
      - Profiles, pages and folders: profiles.md
      - Multi Action and Key Logic: multi-actions.md
      - Workflows: workflows.md
      - Lights: lights.md
      - Plugins and the store: plugins.md
  - Updates: updates.md
  - Troubleshooting: troubleshooting.md
  - Privacy: privacy.md
  - For maintainers:
      - Releasing and signing: maintainers/releasing.md
      - Writing plugins: maintainers/plugins.md
