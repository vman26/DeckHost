# Versions from git (GitVersion 6, used through GitVersion.MsBuild in Directory.Build.props).
# Tags (v1.4.0, v1.4.0-rc.1) are the versions; between them the branch decides what comes next:
#   develop, feature/*   next minor, alpha      1.4.0-alpha.N
#   bugfix/*             as its source branch   from develop 1.4.0-alpha.N, from main 1.3.1-alpha.N
#   release/1.4.0        the version in the name, rc
#   hotfix/*             next patch, beta       1.3.1-beta.N (hotfix/1.3.5: 1.3.5-beta.N)
#   anything else        as its source branch, alpha
# "+semver: major|minor|patch" in a commit message bumps further. See README "Versions and releases".
workflow: GitFlow/v1
mode: ContinuousDelivery
next-version: 0.1.0
branches:
  develop:
    label: alpha
  feature:
    mode: ContinuousDelivery
    label: alpha
  bugfix:
    mode: ContinuousDelivery
    label: alpha
    increment: Inherit
    regex: ^bugfix(es)?[\/-](?<BranchName>.+)
    source-branches: [main, develop, release, support, hotfix]
    pre-release-weight: 30000
  release:
    mode: ContinuousDelivery
    label: rc
  hotfix:
    mode: ContinuousDelivery
    label: beta
    increment: Patch
  unknown:
    mode: ContinuousDelivery
    label: alpha
    increment: Inherit
