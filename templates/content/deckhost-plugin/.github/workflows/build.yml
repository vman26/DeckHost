name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet build -c Release
      - name: SHA-256 (for the DeckHost plugin catalog)
        run: sha256sum bin/plugin/*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: plugin
          path: bin/plugin/*.zip
      - name: Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" bin/plugin/*.zip --generate-notes
